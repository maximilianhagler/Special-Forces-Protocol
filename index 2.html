  async function boot() {
    try {
      // Load React, ReactDOM, Recharts, then Babel
      await loadScript('https://unpkg.com/react@18/umd/react.production.min.js');
      await loadScript('https://unpkg.com/react-dom@18/umd/react-dom.production.min.js');
      await loadScript('https://unpkg.com/recharts@2.12.7/umd/Recharts.js');
      
      document.querySelector('#loading .sub').textContent = 'LADE COMPILER...';
      await loadScript('https://unpkg.com/@babel/standalone/babel.min.js');
      
      document.querySelector('#loading .sub').textContent = 'KOMPILIERE...';
      
      // Decode JSX from base64
      const jsxCode = decodeURIComponent(escape(atob(JSX_B64)));
      
      // Compile with Babel in a non-blocking way using setTimeout
      await new Promise((resolve, reject) => {
        setTimeout(() => {
          try {
            const result = Babel.transform(jsxCode, {
              presets: ['react'],
              filename: 'app.jsx'
            });
            resolve(result.code);
          } catch(e) {
            reject(e);
          }
        }, 50); // Small delay to let UI update
      }).then(compiledCode => {
        document.querySelector('#loading .sub').textContent = 'STARTE APP...';
        
        // Execute compiled code
        const fn = new Function('React', 'ReactDOM', 'Recharts', compiledCode + '\n; return App;')(
          React, ReactDOM, Recharts
        );
        
        // Wait for fonts
        setTimeout(() => {
          const root = ReactDOM.createRoot(document.getElementById('root'));
          root.render(React.createElement(fn));
          
          // Hide loading screen
          setTimeout(() => {
            document.getElementById('loading').style.display = 'none';
          }, 200);
        }, 100);
      });
      
    } catch(err) {
      document.getElementById('loading').innerHTML = `
        <div style="text-align:center;padding:20px;color:#ef4444;font-family:monospace;">
          <div style="font-size:32px;margin-bottom:12px">⚠️</div>
          <div style="font-size:10px;letter-spacing:2px;margin-bottom:8px">LADEFEHLER</div>
          <div style="font-size:8px;color:#166534;max-width:280px;word-break:break-all">${err.message}</div>
        </div>
      `;
    }
  }

  // Start boot process
  boot();

  // Prevent zoom on double-tap
  let lastTouch = 0;
  document.addEventListener('touchend', e => {
    const now = Date.now();
    if(now - lastTouch < 300) e.preventDefault();
    lastTouch = now;
  }, {passive: false});
