      s.src=url;s.onload=()=>resolve(true);s.onerror=()=>resolve(false);
      document.head.appendChild(s);
    });
  }
  async function boot(){
    const ls=document.getElementById('ls');
    try{
      ls.textContent='LADE REACT...';
      await loadScript('https://unpkg.com/react@18/umd/react.production.min.js');
      await loadScript('https://unpkg.com/react-dom@18/umd/react-dom.production.min.js');
      ls.textContent='LADE CHARTS...';
      await loadScript('https://unpkg.com/recharts@2.12.7/umd/Recharts.js');
      if(!window.Recharts||!window.Recharts.LineChart)
        await loadScript('https://cdn.jsdelivr.net/npm/recharts@2.12.7/umd/Recharts.js');
      if(!window.Recharts||!window.Recharts.LineChart){
        const stub=()=>null;
        const RC=(p)=>{
          const ch=typeof p.children==='function'?p.children(300,p.height||200):p.children;
          return React.createElement('div',{style:{width:'100%',height:(p.height||200)+'px'}},ch);
        };
        window.Recharts={LineChart:stub,Line:stub,AreaChart:stub,Area:stub,RadarChart:stub,
          Radar:stub,PolarGrid:stub,PolarAngleAxis:stub,XAxis:stub,YAxis:stub,
          CartesianGrid:stub,Tooltip:stub,Legend:stub,ResponsiveContainer:RC};
      }
      ls.textContent='LADE COMPILER...';
      await loadScript('https://unpkg.com/@babel/standalone/babel.min.js');
      if(!window.Babel) await loadScript('https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js');
      ls.textContent='KOMPILIERE...';
      await new Promise(r=>setTimeout(r,80));
      const code=new TextDecoder().decode(Uint8Array.from(atob(JSX_B64),c=>c.charCodeAt(0)));
      const compiled=Babel.transform(code,{presets:[['react',{runtime:'classic'}]],sourceType:'script',filename:'app.jsx',configFile:false,babelrc:false}).code;
      ls.textContent='STARTE...';
      await new Promise(r=>setTimeout(r,50));
      const App=new Function('React','ReactDOM','Recharts',compiled+'\nreturn App;')(window.React,window.ReactDOM,window.Recharts);
      ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
      await new Promise(r=>setTimeout(r,500));
      const el=document.getElementById('loading');
      el.style.opacity='0';
      setTimeout(()=>el.style.display='none',500);
    }catch(err){
      document.getElementById('loading').innerHTML=`<div style="text-align:center;padding:24px;font-family:monospace;"><div style="font-size:36px;margin-bottom:16px">⚠️</div><div style="font-size:10px;letter-spacing:3px;color:#ef4444;margin-bottom:16px">LADEFEHLER</div><div style="font-size:7.5px;color:#22c55e;max-width:320px;line-height:1.8;word-break:break-all;padding:0 12px">${err.message}</div></div>`;
    }
  }
  boot();
  let lastTouch=0;
  document.addEventListener('touchend',e=>{const now=Date.now();if(now-lastTouch<300)e.preventDefault();lastTouch=now;},{passive:false});
  </script>
</body>
</html>
