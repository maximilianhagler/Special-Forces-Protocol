function getMuscleLoad(exercises,sessionIntensity,distanceKm,category,durationMin){
  // Returns continuous 0.0-1.0: 1.0=primary, 0.45=secondary, 0=none
  const load={};
  Object.keys(MUSCLE_KEYWORDS).forEach(m=>{load[m]=0;});

  if(!exercises||exercises.length===0){
    const base=CAT_MUSCLES[category]||{};
    Object.entries(base).forEach(([m,v])=>{load[m]=Math.max(load[m],v/3);});
    if(distanceKm>0){
      const d=distanceKm<5?0.5:distanceKm<10?0.75:1.0;
      ["quads","hamstrings","calves"].forEach(m=>{load[m]=Math.max(load[m],d);});
      ["glutes"].forEach(m=>{load[m]=Math.max(load[m],d*0.6);});
    }
    return load;
  }

  exercises.forEach(ex=>{
    const name=(ex.name||"").toLowerCase();
    const roleKey=Object.keys(MUSCLE_ROLES).find(kw=>name.includes(kw));
    if(roleKey){
      const role=MUSCLE_ROLES[roleKey];
      role.p.forEach(m=>{load[m]=Math.max(load[m],1.0);});
      role.s.forEach(m=>{load[m]=Math.max(load[m],0.45);});
    } else {
      Object.entries(MUSCLE_KEYWORDS).forEach(([muscle,keywords])=>{
        if(keywords.some(kw=>name.includes(kw))){
          load[muscle]=Math.max(load[muscle],0.7);
        }
      });
    }
  });
  return load;
}

function getSessionMuscleLoad(session){
  let exs=session.exercises||[];
  if(exs.length===0&&session.exercises_text){
    exs=(session.exercises_text||"").split("\n").filter(Boolean).map(line=>{
      const m=line.match(/^(.+?)\s+(\d+)\s*[xX×]\s*(\d+(?:[,.]?\d+)?)\s*([\d,.]+)?\s*(?:kg)?/i);
      if(m)return{name:m[1].trim(),sets:+m[2],reps:parseFloat(m[3].replace(",","."))||8,weight:m[4]?parseFloat(m[4].replace(",","."))||0:0};
      return{name:line.trim(),sets:3,reps:8,weight:0};
    });
  }
  return getMuscleLoad(exs,session.intensity||5,
    session.distance_km||parseFloat((session.distance_raw||"0").replace(",","."))||0,
    session.category||"",
    session.duration||p2m(session.duration_raw)||45);
}

function getTotalMuscleLoad(sessions){
  const totals={};
  Object.keys(MUSCLE_KEYWORDS).forEach(m=>{totals[m]=0;});
  sessions.forEach(s=>{
    const load=getSessionMuscleLoad(s);
    Object.entries(load).forEach(([m,v])=>{totals[m]+=v;});
  });
  const maxVal=Math.max(0.001,...Object.values(totals));
  const norm={};
  // Normalize to 0-1 continuous
  Object.entries(totals).forEach(([m,v])=>{norm[m]=Math.min(1,v/maxVal);});
  return norm;
}

// Lazy load the real package
let _RBH=null, _rbhLoading=false, _rbhCallbacks=[];
function loadRBH(cb){
  if(_RBH){cb(_RBH);return;}
  _rbhCallbacks.push(cb);
  if(_rbhLoading)return;
  _rbhLoading=true;
  import("https://esm.sh/react-body-highlighter@2.0.5").then(m=>{
    _RBH=m.default||m.Model;
    _rbhCallbacks.forEach(f=>f(_RBH));
    _rbhCallbacks=[];
  }).catch(()=>{
    _rbhCallbacks.forEach(f=>f(null));
    _rbhCallbacks=[];
  });
}

function GoalsTab(p){

  </div>;
}

  const root = ReactDOM.createRoot(document.getElementById('root'));
  root.render(React.createElement(App));
  </script>

  <script>
    // PWA Service Worker
    if('serviceWorker' in navigator){
      navigator.serviceWorker.register('sw.js').catch(()=>{});
    }
    // Prevent zoom on double-tap
    let lastTouch = 0;
    document.addEventListener('touchend', function(e){
      const now = Date.now();
      if(now - lastTouch < 300) e.preventDefault();
      lastTouch = now;
    }, {passive: false});
  </script>
